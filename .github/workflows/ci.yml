name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and tools
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate skills, templates and links
        run: node scripts/validate.mjs

      - name: Test git-attribution-guard
        run: node --test tools/git-attribution-guard/guard.test.mjs
